<VirtualHost *:80>
    # ServerName crm.microimageph.com
    # ServerAdmin admin@microimageph.com

    # Project Root
    DocumentRoot /var/www/mi_crm

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/mi_crm_error.log
    CustomLog ${APACHE_LOG_DIR}/mi_crm_access.log combined

    # Static and Media Files
    Alias /static /var/www/mi_crm/staticfiles
    Alias /media /var/www/mi_crm/media

    <Directory /var/www/mi_crm/staticfiles>
        Require all granted
    </Directory>

    <Directory /var/www/mi_crm/media>
        Require all granted
    </Directory>

    <Directory /var/www/mi_crm/crm_project>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # WSGI Configuration
    # Replace /path/to/venv with your actual virtual environment path
    # Replace /var/www/mi_crm with the actual path to the project
    WSGIDaemonProcess mi_crm python-path=/var/www/mi_crm python-home=/var/www/mi_crm/venv
    WSGIProcessGroup mi_crm
    WSGIScriptAlias / /var/www/mi_crm/crm_project/wsgi.py

    # Environment Variables (Optional - better to set in /etc/apache2/envvars or systemd)
    # SetEnv DJANGO_SETTINGS_MODULE crm_project.settings
    # SetEnv DATABASE_NAME mi_crm_db
    # SetEnv DATABASE_USER crm_user
    # SetEnv DATABASE_PASSWORD secure_password
</VirtualHost>
